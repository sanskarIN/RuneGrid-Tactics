name: Godot .NET Source Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  csharp-source:
    name: Restore, build, and validate native content
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore Godot C# dependencies
        run: dotnet restore RuneGrid.Tactics.csproj
      - name: Restore deterministic pathfinding tests
        run: dotnet restore Tests/RuneGrid.Tactics.Pathfinding.Tests.csproj
      - name: Compile C# source
        run: dotnet build RuneGrid.Tactics.csproj --no-restore --configuration Release
      - name: Run advanced pathfinding unit tests
        run: dotnet test Tests/RuneGrid.Tactics.Pathfinding.Tests.csproj --no-restore --configuration Release --logger "console;verbosity=normal"
      - name: Validate project records and export presets
        run: node Tools/validate-project.mjs .
